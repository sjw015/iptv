<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OK影视接口更新</title>
    <style>
        :root {
            --bg: #0d0d16;
            --surface: #161622;
            --surface2: #1e1e30;
            --text: #e0e0f0;
            --text2: #9696b0;
            --accent: #6c5ce7;
            --accent2: #00d2a0;
            --border: #2a2a40;
            --radius: 14px;
            --radius-sm: 10px;
            --error: #f87171;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 20px 16px;
        }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow); }
        .hidden { display: none !important; }
        #authContainer .card { text-align: center; padding: 36px 28px; max-width: 420px; margin: 0 auto; }
        #authContainer .lock-icon { font-size: 3.2rem; margin-bottom: 6px; display: block; }
        #authContainer h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-input-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .auth-input-wrap { position: relative; display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .auth-input-wrap input { flex: 1; padding: 14px 16px; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; }
        .toggle-pwd { background: none; border: none; color: var(--text2); font-size: 1.2rem; padding: 0 14px; cursor: pointer; }
        .auth-error { min-height: 24px; font-size: 0.85rem; color: var(--error); text-align: left; padding-left: 4px; }
        .auth-error.empty { opacity: 0; }
        .auth-btn, .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 14px 20px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s; }
        .auth-btn:active, .btn-primary:active { transform: scale(0.97); background: #5a4bd1; }
        #mainContainer h1 { text-align: center; font-size: 1.8em; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        textarea { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; resize: vertical; min-height: 300px; outline: none; font-family: monospace; line-height: 1.5; margin-top: 12px; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1); }
        .char-count { font-size: 0.75em; color: var(--text2); text-align: right; margin-top: 4px; }
        .toolbar { display: flex; justify-content: flex-end; margin: 8px 0 12px 0; }
        .btn-clear { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 6px 14px; border-radius: 20px; font-size: 0.8em; cursor: pointer; }
        .status { font-size: 0.9em; min-height: 24px; color: var(--text2); margin-top: 8px; text-align: center; }
        .status.success { color: var(--accent2); }
        .status.error { color: var(--error); }
        .load-status { font-size: 0.8em; color: var(--text2); text-align: center; margin-bottom: 10px; }
        .load-status .ok { color: var(--accent2); }
        .load-status .err { color: var(--error); }
        .retry-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 2px 12px; border-radius: 20px; font-size: 0.8em; cursor: pointer; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 密码验证卡片 -->
        <div id="authContainer">
            <div class="card">
                <span class="lock-icon">🔐</span>
                <h2>输入密码</h2>
                <p style="color:var(--text2); font-size:0.9rem; margin-top:4px;">请输入访问密码以继续</p>
                <div class="auth-input-group">
                    <div class="auth-input-wrap" id="authInputWrap">
                        <input type="password" id="authPassword" placeholder="请输入密码" autocomplete="current-password" autofocus />
                        <button class="toggle-pwd" id="togglePwdBtn" type="button">👁️</button>
                    </div>
                    <div class="auth-error empty" id="authError"></div>
                </div>
                <button class="auth-btn" id="authBtn" style="margin-top:10px;">确认</button>
            </div>
        </div>

        <!-- 主界面 -->
        <div id="mainContainer" class="hidden">
            <div class="card">
                <h1>🐱 OK影视接口更新</h1>
                <div class="load-status" id="loadStatus"><span>⏳ 正在加载内容...</span></div>
                <textarea id="contentInput" placeholder="等待加载或在此粘贴内容..."></textarea>
                <div class="char-count" id="charCount">0 字符</div>
                <div class="toolbar">
                    <button class="btn-clear" id="clearContentBtn">🗑️ 清空内容</button>
                </div>
                <button class="btn-primary" id="updateBtn">
                    <span id="btnText">📤 更新内容</span>
                    <span id="btnLoader" style="display:none;">⏳</span>
                </button>
                <div class="status" id="statusMsg"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const ACCESS_PASSWORD = 'hunter15';
            
            // 自动获取当前页面的 ID (例如从 /ID/2o66lp8z 提取出 2o66lp8z)
            const pathParts = window.location.pathname.split('/');
            const currentSlug = pathParts[pathParts.length - 1] || '';
            const API_URL = '/ymzz/update-code'; 

            const authContainer = document.getElementById('authContainer');
            const mainContainer = document.getElementById('mainContainer');
            const authInput = document.getElementById('authPassword');
            const authBtn = document.getElementById('authBtn');
            const authError = document.getElementById('authError');
            const authWrap = document.getElementById('authInputWrap');
            const togglePwdBtn = document.getElementById('togglePwdBtn');

            const contentInput = document.getElementById('contentInput');
            const updateBtn = document.getElementById('updateBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const statusMsg = document.getElementById('statusMsg');
            const charCount = document.getElementById('charCount');
            const loadStatus = document.getElementById('loadStatus');
            const clearContentBtn = document.getElementById('clearContentBtn');

            function doAuth() {
                if (authInput.value === ACCESS_PASSWORD) {
                    authContainer.classList.add('hidden');
                    mainContainer.classList.remove('hidden');
                    initMain();
                    setTimeout(() => contentInput.focus(), 300);
                } else {
                    authError.textContent = '❌ 密码错误，请重试';
                    authError.classList.remove('empty');
                    authInput.value = '';
                    authInput.focus();
                }
            }

            authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
            authBtn.addEventListener('click', doAuth);
            
            let pwdVisible = false;
            togglePwdBtn.addEventListener('click', () => {
                pwdVisible = !pwdVisible;
                authInput.type = pwdVisible ? 'text' : 'password';
                togglePwdBtn.textContent = pwdVisible ? '🙈' : '👁️';
            });

            function initMain() {
                contentInput.addEventListener('input', () => {
                    charCount.textContent = contentInput.value.length + ' 字符';
                });

                clearContentBtn.addEventListener('click', () => {
                    contentInput.value = '';
                    charCount.textContent = '0 字符';
                    statusMsg.textContent = '';
                });

                async function loadContent() {
                    loadStatus.innerHTML = '<span>⏳ 正在加载内容...</span>';
                    try {
                        const resp = await fetch(window.location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const text = await resp.text();
                        contentInput.value = text;
                        charCount.textContent = text.length + ' 字符';
                        loadStatus.innerHTML = '✅ 已加载现有内容 (<span class="ok">' + text.length + ' 字符</span>)';
                    } catch (err) {
                        loadStatus.innerHTML = '<span class="err">⚠️ 加载失败</span><button class="retry-btn" id="retryLoadBtn">重试</button>';
                        document.getElementById('retryLoadBtn')?.addEventListener('click', loadContent);
                    }
                }

                async function handleUpdate() {
                    const content = contentInput.value;
                    if (!content.trim()) {
                        statusMsg.textContent = '❌ 内容不能为空';
                        statusMsg.className = 'status error';
                        return;
                    }

                    updateBtn.disabled = true;
                    btnText.style.display = 'none';
                    btnLoader.style.display = 'inline';
                    statusMsg.textContent = '⏳ 正在更新...';
                    statusMsg.className = 'status';

                    try {
                        const formData = new FormData();
                        formData.append('code', content);
                        formData.append('slug', currentSlug); // 传递当前页面的 ID 进行精准覆盖

                        const resp = await fetch(API_URL, {
                            method: 'POST',
                            body: formData
                        });
                        
                        const data = await resp.json();
                        if (!resp.ok || !data.success) throw new Error(data.error || '更新失败');

                        statusMsg.textContent = '✅ 更新成功！';
                        statusMsg.className = 'status success';
                        // 更新成功后重新加载当前内容，验证是否写入成功
                        setTimeout(loadContent, 500);
                    } catch (err) {
                        statusMsg.textContent = '❌ 更新失败: ' + err.message;
                        statusMsg.className = 'status error';
                    } finally {
                        updateBtn.disabled = false;
                        btnText.style.display = 'inline';
                        btnLoader.style.display = 'none';
                    }
                }

                updateBtn.addEventListener('click', handleUpdate);
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleUpdate();
                });

                loadContent();
            }
        })();
    </script>
</body>
</html>
