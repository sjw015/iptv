name: 自动同步IPTV源

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-iptv:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载最新M3U源文件
        run: |
          curl -vL --max-time 60 \
            --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://xymm.1000s.dpdns.org/iptv" \
            -o smart.txt || {
              echo "❌ 下载失败，curl退出码：$?"
              exit 1
            }

      - name: 校验文件有效性
        run: |
          if [ ! -s smart.txt ]; then
            echo "❌ 下载的文件为空"
            exit 1
          fi
          if ! grep -q "#EXTM3U" smart.txt; then
            echo "❌ 文件不是有效的M3U格式，内容预览："
            head -20 smart.txt
            exit 1
          fi
          echo "✅ 文件有效，行数：$(wc -l < smart.txt)"

      - name: 提交并推送更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add smart.txt
          git commit -m "自动同步IPTV源列表" || {
            echo "ℹ️ 文件无变更，跳过提交"
            exit 0
          }
          git push
